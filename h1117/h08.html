<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var input = prompt("숫자를 입력하세요.");
        switch(input){
            case "1":
                document.write("1입력");
                break;
            case "2":
                document.write("2입력");
                break;
            case "3":
                document.write("3입력");
                break;
            case "4":
                document.write("4입력");
                break;
            default:
                document.write("1,2,3,4제외입력");
        }
    </script>
</body>
</html>

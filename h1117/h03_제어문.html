        /*
        자바스크립트에서 html태그의 값을 가져오는 방법
        input에 있는 값을 가져올 때 value
        그외 나머지값을 가져올 때 : innerText
        html을 가져오려면 innerHtml
        */
        function loginBtn(){
            var id = document.querySelector("#id");
            var subTxt = document.querySelector("#subTxt");
            if(id.value == ''){
                alert(document.querySelector("#labelTxt").innerText+"를 입력하세요.");
                subTxt.innerText = "";
                subTxt.innerText = "로그인정보를 다시입력하세요.";
            }else{
                subTxt.innerText = "";
                subTxt.innerText = "로그인정보";
            }
        }
    </script>
    <h1 id="subTxt">로그인 정보</h1>
    <form action="#" method="post">

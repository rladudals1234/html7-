<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="h1">과일목록</h1>
    <h2 class="h2">바나나</h2>
    <h2 class="h3">딸기</h2>
    <h2 class="h4">사과</h2>
    <h4 class="h5">
        <ul>
            <li>배</li>
            <li>수박</li>
        </ul>
    </h4>
    <script>
        alert("경고창 생성");
        document.querySelector(".h1").innerText = "비밀번호 불일치";
        document.querySelector(".h2").innerText = "바나나";
        console.log(document.querySelector(".h3").innerText);
        console.log(document.querySelector(".h4").innerText);
        document.querySelector(".h5").innerHTML = "";
        document.querySelector(".h5").innerHTML += "<ul>";
        document.querySelector(".h5").innerHTML += "<li>배</li>";
        document.querySelector(".h5").innerHTML += "<li>수박</li>";
        document.querySelector(".h5").innerHTML += "</ul>";
        //innerHTML, innerText로 글자넣기 제이쿼리 ajax로 서버에서 데이터를 비동기통신으로 받아서 해당 태그안에 넣을때 사용
        // - 전체 새로고침으로 로딩하면 느리지만 ajax로 특정 태그안에만 변경됨 속도↑
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화진흥위원회api데이터</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            width: 100px;
            height: 40px;
            text-align: center;
        }
        #txt{
            width: 400px;
            height: 50px;
            border: 1px solid black;
        }
        img{
            width: 100px;
            height: 100px;
        }
    </style>
    <script>
        $(function(){
            $('#takeBtn').click(function(){
                $.ajax({
                    url: 'https://apis.data.go.kr/B551011/PhotoGalleryService1/galleryList1?serviceKey=918RE13GA7OY7ZEmUzApgbOeAcQoZ%2FaHsXWcqPAKQ9YNNPj83KOstRMRIUrCFIAcm9qj2R6b7NFZjp%2FYsYzJLg%3D%3D&numOfRows=10&pageNo=1&MobileOS=ETC&MobileApp=AppTest&arrange=A&_type=json',
                    type: 'get',
                    dataType: 'json',
                    success: function(data){
                        console.log(data);
                        for (var i = 0; i < data.response.body.items.item.length; i++) {
                            $('#tbody').append(`<tr>
                                <td>${data.response.body.items.item[i].galContentId}</td>
                                <td>${data.response.body.items.item[i].galTitle}</td>
                                <td>${data.response.body.items.item[i].galCreatedtime}</td>
                                <td>${data.response.body.items.item[i].galPhotographyLocation}</td>
                                <td>${data.response.body.items.item[i].galPhotographer}</td>
                                <td>${data.response.body.items.item[i].galSearchKeyword}</td>
                                <td><img src="${data.response.body.items.item[i].galWebImageUrl}"></td>
                            </tr>`);
                        }
                    },error: function(e){
                        console.log(e);
                    }
                })
            })
        });
    </script>
</head>
<body>
    <button type="button" id="takeBtn">데이터가져오기</button>
    <form action="#" method="get" id="form">
        <label>번호</label>
        <input type="text" id="sno" name="sno"><br>
        <label>이름</label>
        <input type="text" id="name" name="name"><br>
        <label>국어</label>
        <input type="text" id="kor" name="kor"><br>
        <label>영어</label>
        <input type="text" id="eng" name="eng"><br>
        <label>수학</label>
        <input type="text" id="math" name="math" onkeyup="enterBtn(event)"><br>
        <button type="button" id="sbtn">성적저장</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>촬영일</th>
                <th>촬영장소</th>
                <th>작가</th>
                <th>키워드</th>
                <th>이미지</th>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>
    <script>
    </script>
</body>
</html>

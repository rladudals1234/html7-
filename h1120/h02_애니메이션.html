<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <style>
        img{width: 300px;}
    </style>
    <script>
        $(function(){
            $("#aBtn").click(function(){
                //$("img").stop().animate({width:"400px"},1000);
                $("img").stop().animate({width:"+=100px"},1000);
            });
            $("#aBtn_no").click(function(){
                //$("img").stop().animate({width:"300px"},1000);
                $("img").stop().animate({width:"-=100px"},1000);
            });
        });
    </script>
</head>
<body>
    <button type="button" id="aBtn">확대</button>
    <button type="button" id="aBtn_no">축소</button>
    <br>
    <img src="../images/hana1.jpg">
</body>
</html>

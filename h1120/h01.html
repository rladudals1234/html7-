<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>애니메이션</title>
    <style>
        #txt{
            border:1px solid black; width:300px; height:200px;
            display: none;
        }
    </style>
    <script>
        $(function(){
            $("#aBtn").click(function(){
                let aBtn = $(this);
                aBtn.text()=="애니메이션 닫힘"?aBtn.text("애니메이션 닫히는중"):aBtn.text("애니메이션 나타나는중");
                $("#txt").stop().fadeToggle(1000,function(){
                    if(aBtn.text()=="애니메이션 닫히는중" || aBtn.text()=="애니메이션 닫힘"){
                        $("#aBtn").text("애니메이션 나타남");
                    }else{
                        $("#aBtn").text("애니메이션 닫힘");
                    }
                });
            });
            /*$("#aBtn").click(function(){
                $("#txt").stop().fadeIn(1000,function(){
                    
                });
            });
            $("#aBtn_no").click(function(){
                $("#txt").stop().fadeOut(1000,function(){
                    
                });
            });*/
        });//jquery
    </script>
</head>
<body>
    <button type="button" id="aBtn">애니메이션 나타남</button>
    <button type="button" id="aBtn_no">애니메이션 사라짐</button>
    <br>
    <div id="txt">
        인천에서 배로 출발해 백두산 남파 입구까지 2박3일이 걸렸다. 한국의 기온이 35°C를 넘고 있을 때 남파 입구의 전광판에는 21°C가 찍혔다. 가이드는 천지에 오르면 추우니까 긴팔 옷과 우비를 준비하라고 했다. 오전에 비가 많이 내려 천지를 본 탐방객은 없다고 한다. 우리 일행들도 불안한 표정이 역력하다.
    </div>
</body>
</html>

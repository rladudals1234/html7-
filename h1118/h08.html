        $(function(){
            //이벤트에 관련된 사항은 이 구문안에 작성해야함.
            $("#txt").text("안녕");     //jquery구문, 자바스크립트 : innerText = "안녕"
            console.log("이름 : ",$(".c").text());      //안 나올 경우 서버 실행하면 나옴(캐시삭제는 안해봄)
            $("#sno").val("1번");   //input 출력
            console.log("이름 : ",$("#name").val());
            console.log($("p").text());
            console.log($("ul").html());    //innerHTML과 같다.
        });
    </script>
    <div id="txt"></div>
    <div class="c">홍길동</div>
    <p>안녕하세요.</p>
    <input type="text" id="sno"><br>
    <input type="text" id="name" value="유관순"><br>
    <ul>
        <li>바나나</li>
        <li>사과</li>
    </ul>
</body>

    </script>
    <label>이름</label>
    <input type="text" id="name" onkeyup="keyBtn(event)" placeholder="이름을 입력하세요.">
    <button type="button" onclick="saveBtn()">저장</button>
    <button type="button" onclick="delBtn()">삭제</button>
    <div id="txt"></div>
    <script>
        var arr = ['홍길동','유관순','이순신'];
        document.querySelector("#txt").innerText = arr;
        //저장 누르면 배열에 추가
        function saveBtn(){
            var name = document.querySelector("#name").value;
            arr.push(name);
            document.querySelector("#txt").innerText = arr;
        }
        function delBtn(){
            var name = document.querySelector("#name").value;
            if(arr.indexOf(name) == -1){
                alert("이름이 없습니다.");
                return;
            }else{
                arr.splice(arr.indexOf(name),1);
            }
            document.querySelector("#txt").innerText = arr;
        }
        function keyBtn(event){
            console.log("입력한 키값 : ",event.keyCode);
            if(event.keyCode == 13){
                saveBtn();
            }
        }
    </script>

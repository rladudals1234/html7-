        var random = parseInt(Math.random()*100)+1;
        var i = 0;
        while(i<10){
            var num = parseInt(prompt("1~100까지 숫자를 입력하시오."));
            if(random > num){
                alert(`${num}보다 높은 수입니다.`);
                document.write(`${num}보다 높은 수입니다.<br>`);
            }else if(random < num){
                alert(`${num}보다 낮은 수입니다.`);
                document.write(`${num}보다 낮은 수입니다.<br>`);
            }else{
                alert(`${num}은 정답입니다.`);
                break;
            }
            i++;
        }
        document.write(`정답 : ${random}`);

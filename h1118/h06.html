<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            width: 100px;
            height: 40px;
            text-align: center;
        }
        #txt{
            width: 400px;
            height: 50px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <textarea id="txt" onkeyup="keyBtn(event)">1,홍길동,100,100,100</textarea>
    <button type="button" onclick="conBtn()">확인</button>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <!-- <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>100</td>
                <td>100</td>
                <td>100</td>
            </tr> -->
        </tbody>
    </table>
    <!-- <div id="txt1"></div>
    <button type="button" onclick="func(10,2,'txt1')">확인1</button>
    <div id="txt2"></div>
    <button type="button" onclick="func(2,4,'txt2')">확인2</button>
    <div id="txt3"></div>
    <button type="button" onclick="func(1,3,'txt3')">확인3</button> -->
    <script>
        //함수 - 코드 중복방지, 관리의 효용성
        /*
        function func(a,b,tstr){
            document.querySelector("#"+tstr).innerText = calc(a,b);
        }

        function calc(a,b){
            return (a+b)*10;    //return 호출하는 지점으로 값을 돌려줌
        }
        */
        function conBtn(){
            var txt = document.querySelector("#txt").value;
            var arr = txt.split(",");
            console.log(arr);
            var tbody = document.querySelector("#tbody");
            //tbody.innerHTML = "";
            //기존데이터에 입력된 데이터 추가
            tbody.innerHTML += `<tr>
                                    <td>${isNull(arr[0])}</td>
                                    <td>${isNull(arr[1])}</td>
                                    <td>${isNull(arr[2])}</td>
                                    <td>${isNull(arr[3])}</td>
                                    <td>${isNull(arr[4])}</td>
                                    <td>${isNull(sum([arr[2],arr[3],arr[4]]))}</td>
                                    <td>${isNull(avg([arr[2],arr[3],arr[4]]))}</td>
                                </tr>`;
            document.querySelector("#txt").value = "";
            document.querySelector("#txt").focus();
        }
        function keyBtn(e){
            if(e.keyCode == 13){
                conBtn();
            }
        }

        function isNull(txt){
            return txt!=undefined?txt:""
        }
        function sum(arr){
            var sum = 0;
            for(var i=0; i<arr.length; i++){
                if(isNaN(arr[i])){
                    sum += 0;
                }else{
                    sum += parseInt(arr[i]);
                }
            }
            return sum;
        }
        function avg(arr){
            var sum = 0;
            for(var i=0; i<arr.length; i++){
                if(isNaN(arr[i])){
                    sum += 0;
                }else{
                    sum += parseInt(arr[i]);
                }
            }
            return sum/arr.length;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script>
        //선택자:#,.
        //글자출력,입력 : text()-글자, val()-값
        //형제관계에서 찾기 : eq()-형재관계에서 찾기
        //parent()-부모,children()-자식,next()-다음,prev()-이전
        //closest()-가까운 태그
        //속성값읽기 : attr()-속성
        $(function(){
            console.log($("li"));
            console.log($("li").text());
            console.log($("li").eq(0).text());
            console.log($("ul"));
            console.log($("ul").children().text());
            console.log($("ul").children().eq(3).text());
            console.log($("#li01").parent().html());
            console.log($("#li01").parent().attr("id"));    //속성 : attr
            console.log($("#u01").parent().html());
            console.log($("#li01").next().next().next().text());    //next() : 다음
            console.log($("#li03").text());
            console.log($("#li03").prev().text());  //prev() : 이전
            console.log($("#li03").closest("ul").eq(0));
        });
    </script>
</head>
<body>
    <ul id="u01">
        <li id="li01">1</li>
        <li>홍길동</li>
        <li>100</li>
        <li id="li03">90</li>
        <li>80</li>
        <!-- <li id="li01">바나나</li>
        <li>사과</li>
        <li>배</li>
        <li>딸기</li>
        <li>수박</li> -->
    </ul>
</body>
</html>

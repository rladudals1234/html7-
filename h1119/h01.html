        $(document).ready(function(){
            $("#sbtn").click(function(){
                var checkName = $("#sbtn").text();

                    var sno = $("#sno").val();
                    $("#TEST"+sno).remove();
                    var name = $("#name").val();
                    var kor = Number($("#kor").val());
                    var eng = Number($("#eng").val());
                    var math = Number($("#math").val());
                    var sum = parseInt(kor) + parseInt(eng) + parseInt(math);

                        <td>${sno}</td>
                        <td>${name}</td>
                        <td>${kor}</td>
                        <td>${eng}</td>
                        <td>${math}</td>
                        <td>${sum}</td>
                        <td>${avg}</td>

                            <button type="button" id="deleteBtn" onclick="deleteBtn(this)">삭제</button>

                    var eng = Number($("#eng").val());

                    var sum = parseInt(kor) + parseInt(eng) + parseInt(math);

                    $("#tbody").append(`<tr id="TEST${sno}">
                        <td>${sno}</td>

                        <td>${kor}</td>
                        <td>${eng}</td>
                        <td>${math}</td>
                        <td>${sum}</td>
                        <td>${avg}</td>
                        <td>
                            <button type="button" id="updateBtn" onclick="updateBtn(this)">수정</button>
                            <button type="button" id="deleteBtn" onclick="deleteBtn(this)">삭제</button>
                        </td>
                    </tr>`);
                    txt_clear();
                }
            });
        });

            //console.log(tr_e.querySelectorAll("td"));

            if(confirm(name+"학생의 학생성적을 삭제하시겠습니까?")){

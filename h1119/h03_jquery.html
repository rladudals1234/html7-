<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script>
        //기존 태그를 가져와서 새로운 태그를 추가해서 다시 입력하는 형태
        //append() - 뒤에 추가, prepend() -앞에 추가
        //html() : 기존태그삭제후 추가
        $(function(){
            $("#btn").click(()=>{
                //$("#u01").append(`<li>${$("#fruit").val()}</li>`);
                //$("#u01").prepend(`<li>${$("#fruit").val()}</li>`);
                f_append();
            });

            $("#fruit").keyup((e)=>{
                if(e.keyCode == 13){
                    //$("#u01").append(`<li>${$("#fruit").val()}</li>`);
                    //$("#u01").prepend(`<li>${$("#fruit").val()}</li>`);
                    f_append();
                }
            });

            //추가함수
            var f_append = () =>{
                $("#u01").append(`<li>${$("#fruit").val()}</li>`);
                //$("#u01").prepend(`<li>${$("#fruit").val()}</li>`);
            }
        });

        //js 6version, 화살표함수
        /*var btn = () =>{
        }*/
    </script>
</head>
<body>
    <input type="text" id="fruit" name="fruit"><br>
    <button type="button" id="btn">저장</button>
    <ul id="u01">
        <li>바나나</li>
        <li>딸기</li>
        <li>사과</li>
    </ul>
</body>
</html>

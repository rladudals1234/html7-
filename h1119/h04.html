<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //자바스크립트 객체 - 파이썬과 통신
        var stu = {
            "no":1,
            "name":"홍길동",
            "kor":100,
            "eng":100,
            "math":100
        }
        console.log(stu);
        console.log(stu.no);
        //웹에서 다른 web으로 전달시 object객체로 전달하면 해석이 안됨.
        console.log(JSON.stringify(stu));   //json 문자열로 변환
        console.log(JSON.parse('{"no":1,"name":"홍길동","kor":100,"eng":100,"math":100}')); //json형태의 문자열을 객체로 변환
    </script>
</body>
</html>

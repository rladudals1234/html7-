<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생성적 프로그램</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            width: 100px;
            height: 40px;
            text-align: center;
        }
        #txt{
            width: 400px;
            height: 50px;
            border: 1px solid black;
        }
    </style>
    <script>
        $(function(){
            $("#takeBtn").on("click",function(){
                console.log($("#form").serialize()+"&test=test등");
                $.ajax({
                    url:"stus.json",
                    type:"get",
                    data:$("#form").serialize()+"&test=test등",    //서버로 폼에있는 input데이터들 보냄, 다른 파라미터를 끼워넣거나 input type="hidden"에 넣어서 파라미터 보내기 가능
                    dataType:"json",
                    success:function(data){
                        console.log(data);
                        $("#tbody").html("");   //초기화
                        //기본for문
                        for(var i=0;i<data.length;i++){
                            $("#tbody").append(`<tr id="${data[i].sno}">
                                                <td>${data[i].sno}</td>
                                                <td>${data[i].name}</td>
                                                <td>${data[i].kor}</td>
                                                <td>${data[i].eng}</td>
                                                <td>${data[i].math}</td>
                                                <td>${data[i].total}</td>
                                                <td>${data[i].avg}</td>
                                                <td>
                                                    <button type="button" id="uBtn">수정</button>
                                                    <button type="button" id="dBtn">삭제</button>
                                                </td>
                                            </tr>`);
                        }
                        //단순for문 - 배열가능
                        /*for(var i of data){
                            $("#tbody").append(`<tr id="${i.sno}">
                                                <td>${i.sno}</td>
                                                <td>${i.name}</td>
                                                <td>${i.kor}</td>
                                                <td>${i.eng}</td>
                                                <td>${i.math}</td>
                                                <td>${i.total}</td>
                                                <td>${i.avg}</td>
                                                <td>
                                                    <button type="button" id="uBtn">수정</button>
                                                    <button type="button" id="dBtn">삭제</button>
                                                </td>
                                            </tr>`);
                        }*/
                    },
                    error:function(e){           //실패시 실행
                        console.log("error:",e);
                        alert("실패");
                    }
                });
            });
        });
    </script>
</head>
<body>
    <button type="button" id="takeBtn">데이터가져오기</button>
    <form action="#" method="get" id="form">
        <label>번호</label>
        <input type="text" id="sno" name="sno"><br>
        <label>이름</label>
        <input type="text" id="name" name="name"><br>
        <label>국어</label>
        <input type="text" id="kor" name="kor"><br>
        <label>영어</label>
        <input type="text" id="eng" name="eng"><br>
        <label>수학</label>
        <input type="text" id="math" name="math" onkeyup="enterBtn(event)"><br>
        <button type="button" id="sbtn">성적저장</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>비고</th>
            </tr>
        </thead>
        <tbody id="tbody">
        </tbody>
    </table>
    <script>
    </script>
</body>
</html>
